services:
  - type: web
    name: kenlm
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: KENLM_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: CONTEXT_SIZE
        value: "512"
      - key: MAX_TOKENS
        value: "160"
      - key: MODEL_THREADS
        value: "1"
